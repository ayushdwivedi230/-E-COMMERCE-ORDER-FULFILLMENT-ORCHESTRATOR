services:
  # 1. FastAPI Backend Web Service (Supports REST + WebSockets)
  - type: web
    name: ecommerce-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: ENABLE_LLM_REASONING
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString

  # 2. React + TypeScript + Tailwind Frontend (Static Site with SPA Rewrites)
  - type: web
    name: ecommerce-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ecommerce-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. PostgreSQL Managed Database
  - name: ecommerce-db
    region: oregon
    plan: free
    databaseName: ecommerce
    user: ecommerce_user
